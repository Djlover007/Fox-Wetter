<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fox Wetter</title>
<style>
:root{--bg:#eaf3fb;--card:#fff;--text:#16324a;--muted:#5d7488;--accent:#2f80d1;--chip:#d6e7f7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a26;--card:#172737;--text:#e6f0f8;--muted:#8fa6ba;--accent:#5aa9f0;--chip:#223a50;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 4px 12px}
.search{display:flex;gap:8px;position:relative}
.search input{flex:1;min-width:0;border:0;border-radius:14px;padding:14px;font-size:16px;background:var(--card);color:var(--text);outline:none}
.search select{border:0;border-radius:14px;padding:0 8px;background:var(--card);color:var(--text);font-size:16px}
.search button{border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:#fff;font-size:16px}
.sug{position:absolute;top:52px;left:0;right:0;background:var(--card);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:5;overflow:hidden}
.sug div{padding:12px 14px;border-bottom:1px solid var(--chip);cursor:pointer}
.sug div:last-child{border:0}
.sug small{color:var(--muted)}
.hero{background:var(--card);border-radius:24px;padding:24px;text-align:center;margin-top:12px}
.ico{font-size:72px;line-height:1}
.temp{font-size:64px;font-weight:300;margin:4px 0}
.desc{color:var(--muted);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.grid div{background:var(--chip);border-radius:14px;padding:10px 4px;font-size:13px;color:var(--muted)}
.grid b{display:block;font-size:17px;color:var(--text);margin-top:2px}
h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 4px 8px}
.days{background:var(--card);border-radius:20px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--chip)}
.row:last-child{border:0}
.n{width:44px;font-weight:600}
.e{font-size:24px;width:32px}
.s{flex:1;color:var(--muted);font-size:14px}
.m{color:var(--muted)}
.m b{color:var(--text)}
.more{display:block;margin:16px 0 0;padding:12px;border-radius:14px;background:var(--accent);color:#fff;text-decoration:none;font-size:16px}
.upd{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--accent);color:#fff}
.upd span{flex:1}
.upd a{background:#fff;color:var(--accent);padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600}
.msg{text-align:center;color:var(--muted);padding:32px 8px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:16px 8px}
</style>
</head>
<body>
<main>
<h1>🦊 Fox Wetter</h1>
<div id="upd" class="upd" hidden><span>Neue Version verfügbar</span><a id="updlink" target="_blank" rel="noopener" href="#">Aktualisieren</a></div>
<div class="search">
<input id="q" type="search" placeholder="PLZ oder Ort …" autocomplete="off" enterkeyhint="search">
<select id="cc"><option value="DE">DE</option><option value="AT">AT</option><option value="CH">CH</option><option value="">Alle</option></select>
<button id="go">Suchen</button>
<div class="sug" id="sug" hidden></div>
</div>
<div id="out"><div class="msg">Lade …</div></div>
<p class="note">Daten: Open-Meteo.com</p>
</main>
<script src="version.js"></script>
<script>
var REPO="Djlover007/Fox-Wetter";
var CODES={0:["☀️","Klar"],1:["🌤️","Überwiegend klar"],2:["⛅","Teils bewölkt"],3:["☁️","Bedeckt"],45:["🌫️","Nebel"],48:["🌫️","Reifnebel"],51:["🌦️","Leichter Niesel"],53:["🌦️","Niesel"],55:["🌦️","Starker Niesel"],56:["🌧️","Gefrierender Niesel"],57:["🌧️","Gefrierender Niesel"],61:["🌧️","Leichter Regen"],63:["🌧️","Regen"],65:["🌧️","Starker Regen"],66:["🌧️","Gefrierender Regen"],67:["🌧️","Gefrierender Regen"],71:["🌨️","Leichter Schneefall"],73:["🌨️","Schneefall"],75:["❄️","Starker Schneefall"],77:["❄️","Schneegriesel"],80:["🌦️","Leichte Schauer"],81:["🌦️","Schauer"],82:["⛈️","Heftige Schauer"],85:["🌨️","Schneeschauer"],86:["🌨️","Schneeschauer"],95:["⛈️","Gewitter"],96:["⛈️","Gewitter mit Hagel"],99:["⛈️","Gewitter mit Hagel"]};
var DEFAULT={name:"Berlin",lat:52.52,lon:13.41};
function $(id){return document.getElementById(id)}
function code(c){return CODES[c]||["❓","Unbekannt"]}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

function load(place){
  try{localStorage.setItem("wetter_place",JSON.stringify(place))}catch(e){}
  $("out").innerHTML='<div class="msg">Lade …</div>';
  var url="https://api.open-meteo.com/v1/forecast?latitude="+place.lat+"&longitude="+place.lon+
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7";
  fetch(url).then(function(r){return r.json()}).then(function(d){
    var c=d.current,k=code(c.weather_code),h="";
    h+='<section class="hero"><div class="ico">'+k[0]+'</div><div class="temp">'+Math.round(c.temperature_2m)+'°</div>'+
       '<div class="desc">'+esc(place.name)+' · '+k[1]+'</div><div class="grid">'+
       '<div>Gefühlt<b>'+Math.round(c.apparent_temperature)+'°</b></div>'+
       '<div>Wind<b>'+Math.round(c.wind_speed_10m)+' km/h</b></div>'+
       '<div>Feuchte<b>'+c.relative_humidity_2m+' %</b></div></div>'+
       '<a class="more" target="_blank" rel="noopener" href="https://www.wetteronline.de/suche?q='+encodeURIComponent(place.name)+'">Auf WetterOnline ansehen</a></section>';
    h+='<h2>7-Tage-Vorhersage</h2><section class="days">';
    d.daily.time.forEach(function(t,i){
      var dk=code(d.daily.weather_code[i]);
      var day=i===0?"Heute":new Date(t+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short"});
      h+='<div class="row"><span class="n">'+day+'</span><span class="e">'+dk[0]+'</span><span class="s">'+dk[1]+
         '</span><span class="m">'+Math.round(d.daily.temperature_2m_min[i])+'° / <b>'+Math.round(d.daily.temperature_2m_max[i])+'°</b></span></div>';
    });
    $("out").innerHTML=h+'</section>';
  }).catch(function(){
    $("out").innerHTML='<div class="msg">Wetterdaten konnten nicht geladen werden. Bitte Internetverbindung prüfen.</div>';
  });
}

function showResults(list){
  var s=$("sug");
  s.innerHTML="";
  if(!list.length){s.innerHTML='<div>Kein Ort gefunden</div>';s.hidden=false;return}
  list.forEach(function(p){
    var el=document.createElement("div");
    el.innerHTML=esc(p.label)+' <small>'+esc(p.sub)+'</small>';
    el.onclick=function(){s.hidden=true;$("q").value="";load({name:p.name,lat:p.lat,lon:p.lon})};
    s.appendChild(el);
  });
  s.hidden=false;
}

function searchPlz(plz){
  var cc=$("cc").value;
  var countries=cc?[cc]:["DE","AT","CH"];
  return Promise.all(countries.map(function(c){
    return fetch("https://api.zippopotam.us/"+c.toLowerCase()+"/"+encodeURIComponent(plz))
      .then(function(r){return r.ok?r.json():null}).catch(function(){return null});
  })).then(function(res){
    var out=[];
    res.forEach(function(d){
      if(!d||!d.places)return;
      d.places.forEach(function(p){
        out.push({label:d["post code"]+" "+p["place name"],name:p["place name"],
          sub:[p.state,d["country abbreviation"]].filter(Boolean).join(", "),
          lat:parseFloat(p.latitude),lon:parseFloat(p.longitude)});
      });
    });
    return out;
  });
}

function searchName(q){
  return fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=8&language=de"+($("cc").value?"&countryCode="+$("cc").value:""))
  .then(function(r){return r.json()}).then(function(d){
    return (d.results||[]).map(function(p){
      var plz=p.postcodes&&p.postcodes.length?p.postcodes[0]+" ":"";
      return {label:plz+p.name,name:p.name,sub:[p.admin1,p.country].filter(Boolean).join(", "),lat:p.latitude,lon:p.longitude};
    });
  }).catch(function(){return []});
}

function search(){
  var q=$("q").value.trim();
  if(!q)return;
  var isPlz=/^\d{4,5}$/.test(q);
  var first=isPlz?searchPlz(q):searchName(q);
  first.then(function(list){
    if(list.length||!isPlz)return list;
    return searchName(q);
  }).then(showResults);
}

$("go").onclick=search;
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")search()});
document.addEventListener("click",function(e){if(!e.target.closest(".search"))$("sug").hidden=true});

function checkUpdate(){
  var cur=window.APP_BUILD||0;
  if(!cur)return;
  fetch("https://api.github.com/repos/"+REPO+"/releases/latest").then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d||!d.tag_name)return;
    var n=parseInt(String(d.tag_name).replace(/\D/g,""),10);
    if(n>cur){
      var a=(d.assets||[]).filter(function(x){return /\.apk$/i.test(x.name)})[0];
      $("updlink").href=a?a.browser_download_url:d.html_url;
      $("upd").hidden=false;
    }
  }).catch(function(){});
}
checkUpdate();

var saved=DEFAULT;
try{var s=localStorage.getItem("wetter_place");if(s)saved=JSON.parse(s)}catch(e){}
load(saved);
</script>
</body>
</html>
